<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMW M4 City Drive</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#9ec9e8;font-family:Arial}canvas{display:block}#hud{position:fixed;top:16px;left:16px;color:#fff;background:#0009;padding:14px 16px;border-radius:12px;z-index:5;line-height:1.5}#speed{font-size:30px;font-weight:800}#status{position:fixed;right:16px;top:16px;color:#fff;background:#0009;padding:10px 14px;border-radius:10px;z-index:5}</style></head><body><div id="hud"><div id="speed">0 km/h</div>W/↑ accelerate · S/↓ brake · A/D steer · Space handbrake · R reset<br>BMW M4 + McDonald's + KFC + trees</div><div id="status">Loading 3D assets…</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ec9e8);scene.fog=new THREE.Fog(0x9ec9e8,120,700);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1500);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xdcecff,0x536047,1.8));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(80,140,60);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),new THREE.MeshStandardMaterial({color:0x477a42,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);function box(x,y,z,w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.9}));m.position.set(x,y,z);m.receiveShadow=true;scene.add(m)}for(let i=-4;i<=4;i++){box(i*38,.03,0,16,.06,420,0x242424);box(0,.035,i*38,420,.06,16,0x242424)}for(let z=-190;z<=190;z+=12)box(0,.09,z,.35,.03,6,0xffffff);for(let x=-190;x<=190;x+=12)box(x,.09,0,6,.03,.35,0xffffff);
const loader=new GLTFLoader();function load(u){return new Promise((r,j)=>loader.load(u,g=>r(g.scene),undefined,j))}function prep(r){r.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});return r}function normalize(r,target){const b=new THREE.Box3().setFromObject(r),s=b.getSize(new THREE.Vector3()),m=Math.max(s.x,s.y,s.z)||1;r.scale.multiplyScalar(target/m);const b2=new THREE.Box3().setFromObject(r);r.position.y-=b2.min.y;return r}function place(r,x,z){r.position.x=x;r.position.z=z;scene.add(r)}
let car,tree;const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')e.preventDefault();if(e.key.toLowerCase()==='r')reset()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);async function start(){try{car=prep(await load('./assets/m4.glb'));normalize(car,6);car.position.set(0,0,70);scene.add(car);let mcd=prep(await load('./assets/mcd.glb'));normalize(mcd,16);place(mcd,-52,-45);let kfc=prep(await load('./assets/kfc.glb'));normalize(kfc,16);place(kfc,52,-45);tree=prep(await load('./assets/tree.glb'));normalize(tree,12);[[-65,-65],[-65,-20],[-65,25],[-65,70],[65,-65],[65,-20],[65,25],[65,70],[-25,-65],[25,-65],[-25,65],[25,65]].forEach(([x,z],i)=>{let t=tree.clone(true);t.position.set(x,0,z);t.rotation.y=i*.9;scene.add(t)});document.getElementById('status').textContent='Ready — drive around the city'}catch(e){console.error(e);document.getElementById('status').textContent='Run from a local server'}}start();let speed=0,steer=0;function reset(){if(car){car.position.set(0,0,70);car.rotation.set(0,0,0);speed=0}}const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04);if(car){if(keys.w||keys.arrowup)speed+=26*dt;if(keys.s||keys.arrowdown)speed-=38*dt;if(!(keys.w||keys.arrowup||keys.s||keys.arrowdown))speed*=Math.pow(.92,dt*60);if(keys[' '])speed*=Math.pow(.75,dt*60);speed=THREE.MathUtils.clamp(speed,-12,58);let target=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0);steer=THREE.MathUtils.lerp(steer,target,.12);car.rotation.y-=steer*speed*.0009;car.position.x-=Math.sin(car.rotation.y)*speed*dt;car.position.z-=Math.cos(car.rotation.y)*speed*dt;let off=new THREE.Vector3(0,4.2,8).applyQuaternion(car.quaternion);camera.position.lerp(car.position.clone().add(off),.09);camera.lookAt(car.position.clone().add(new THREE.Vector3(0,1,0)));document.getElementById('speed').textContent=Math.round(Math.abs(speed)*3.6)+' km/h'}renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
